[package]
name = "vibe-zone"
version = "3.0.0"
edition = "2021"
description = "Fast mini social API for the Vibe Zone DevFest finale (Rust + append-only log, raw epoll)"
license = "MIT"

[[bin]]
name = "vibe-zone"
path = "src/main.rs"

[dependencies]
# Raw epoll/eventfd syscalls for the net loop; no async runtime, no HTTP
# framework, no JSON library, no database: hand-rolled JSON parsing and
# an append-only log store keep the binary small and the write path
# syscall-cheap under the runner's gVisor sandbox.
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# A panic means the server is dead either way (the net thread is the
# process; a dead writer thread hangs all writes). Abort: no landing
# pads, smaller binary, immediate crash instead of a hung server.
panic = "abort"
