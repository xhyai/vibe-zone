name: vibezone-production
x-limits: &limits
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 192m
  memswap_limit: 192m
  cpus: 1
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
services:
  web:
    <<: *limits
    build:
      context: ..
      dockerfile: leaderboard/Dockerfile
      target: web
    image: vibezone-web:local
    user: "10001:10001"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      VZ_REMOTE_RUNNER: ${VZ_REMOTE_RUNNER:-0}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      BENCH_SMOKE: ${BENCH_SMOKE:-1}
      BENCH_ALLOWED_IMAGE_IDS: ${BENCH_ALLOWED_IMAGE_IDS:-}
      COOKIE_SECURE: "1"
      BONUS_SPEC_FILE: /run/vibezone/bonus.json
    volumes:
      - board-data:/data
      - ${VZ_BONUS_FILE:-/opt/vibe-zone-private/bonus.json}:/run/vibezone/bonus.json:ro
    restart: unless-stopped
    networks: [board]
  scheduler:
    <<: *limits
    profiles: [runner]
    network_mode: none
    image: vibezone-leaderboard:local
    user: "10001:${DOCKER_GID:-0}"
    stop_grace_period: 60s
    command: ["python", "-m", "leaderboard.worker"]
    healthcheck:
      disable: true
    environment:
      VZ_PRIVATE_DIR: /run/vibezone-private
      VZ_RUNNER_ROLE: smoke
      VZ_REMOTE_RUNNER: ${VZ_REMOTE_RUNNER:-0}
      BENCH_SUBNET: ${BENCH_SUBNET:-10.231.42.0/24}
      BENCH_VOLUME_DRIVER: ${BENCH_VOLUME_DRIVER:-}
      BENCH_VOLUME_OPTIONS: ${BENCH_VOLUME_OPTIONS:-}
      BENCH_HOST_PROFILE: ${BENCH_HOST_PROFILE:-local-unverified}
      BENCH_SMOKE: ${BENCH_SMOKE:-1}
      BENCH_ALLOWED_IMAGE_IDS: ${BENCH_ALLOWED_IMAGE_IDS:?Set the reviewed starter ID for this test host}
    volumes:
      - board-data:/data
      - board-results:/results
      - ${VZ_PRIVATE_CHECKS:-/opt/vibe-zone-private/checks}:/run/vibezone-private:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    <<: *limits
    cap_add: [NET_BIND_SERVICE]
    image: caddy@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    ports:
      - "[::]:80:80"
      - "[::]:443:443"
    environment:
      DOMAIN: ${DOMAIN:-devfest.atlasapx.pl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [board, edge]
volumes:
  board-data:
  board-results:
  caddy-data:
  caddy-config:
networks:
  board:
    internal: true
    ipam:
      config:
        - subnet: ${BOARD_SUBNET:-10.231.41.0/24}
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.231.40.0/24}
