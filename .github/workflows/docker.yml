name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - starter/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: starter
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/xhyai/vibe-zone:latest
            ghcr.io/xhyai/vibe-zone:${{ github.sha }}
